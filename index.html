<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Apple Music Widget</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#111;color:#8fd8ff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif}
  .wrap{padding:24px;max-width:680px;margin:auto}
  button{border:0;border-radius:999px;padding:12px 18px;background:#8fd8ff;color:#111;font-weight:700;cursor:pointer}
  p{margin:12px 0 18px}
  iframe{width:100%;height:450px;border:0;border-radius:14px;background:transparent}
</style>
</head>
<body>
<div class="wrap">
  <button id="login">🎵 Iniciar sesión con Apple Music</button>
  <p id="status">Primero prueba el login en una ventana aparte.</p>

  <iframe
    id="player"
    allow="autoplay *; encrypted-media *; fullscreen *; clipboard-write"
    frameborder="0"
    height="450"
    style="overflow:hidden"
    sandbox="allow-forms allow-popups allow-same-origin allow-scripts allow-top-navigation-by-user-activation"
    src="https://embed.music.apple.com/es/playlist/me-vo-a-comer-el-mundo-como-un-bistec/pl.u-V9D7m8JI3MGWyqy?l=es">
  </iframe>
</div>

<script>
const login = document.getElementById('login');
const status = document.getElementById('status');

login.addEventListener('click', () => {
  const w = window.open(
    'https://music.apple.com/es/browse',
    'appleMusicLogin',
    'width=900,height=700,resizable=yes,scrollbars=yes'
  );

  if (!w) {
    status.textContent = 'Safari ha bloqueado la ventana emergente. Permite pop-ups para esta página.';
    return;
  }

  status.textContent = 'Se ha abierto Apple Music en otra ventana. Inicia sesión allí y vuelve a esta página.';
  const timer = setInterval(() => {
    if (w.closed) {
      clearInterval(timer);
      status.textContent = 'Ventana cerrada. Ahora prueba a reproducir la playlist.';
    }
  }, 500);
});
</script>
</body>
</html>
