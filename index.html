<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Apple Music Widget</title>
<style>
  html,body{margin:0;padding:0;background:transparent}
  body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif}
  .player{width:100%;max-width:660px;margin:auto}
  iframe{
    display:block;
    width:100%;
    height:450px;
    border:0;
    border-radius:14px;
    background:transparent;
  }
</style>
</head>
<body>
  <div class="player">
    <iframe
      allow="autoplay *; encrypted-media *; fullscreen *; clipboard-write"
      frameborder="0"
      height="450"
      style="overflow:hidden"
      sandbox="allow-forms allow-popups allow-same-origin allow-scripts allow-top-navigation-by-user-activation"
      src="https://embed.music.apple.com/es/playlist/me-vo-a-comer-el-mundo-como-un-bistec/pl.u-V9D7m8JI3MGWyqy?l=es">
    </iframe>
  </div>
</body>
</html>
